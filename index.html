        window.saveState = function() {

        const defaultVerses = [
            "Rabbiniz şöyle buyurdu: Bana dua edin, duanıza cevap vereyim.",
            "Şüphesiz güçlükle beraber bir kolaylık vardır. Gerçekten, güçlükle beraber bir kolaylık vardır.",
            "Allah bir kimseye gücünün yettiğinden başkasını yüklemez.",
            "Bana sormak derlerse; ben şüphesiz çok yakınım. Bana dua edenin duasına icabet ederim.",
            "Kalb ancak Allah'ı anmakla huzur bulur.",
            "Ey Rabbimiz! Üzerimize sabır yağdır ve canımızı müslüman olarak al.",
            "Rabbim! Göğsümü aç, işimi bana kolaylaştır."
        ];

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-brand-primary', 'text-white', 'shadow');
                el.classList.add('text-brand-muted', 'hover:bg-gray-100');
            });
            document.getElementById(tabId).classList.add('active');
            const btn = document.getElementById('btn-' + tabId);
            if(btn) {
                btn.classList.remove('text-brand-muted', 'hover:bg-gray-100');
                btn.classList.add('bg-brand-primary', 'text-white', 'shadow');
            }
        }

        let modalSaveCallback = null;
        window.openModal = function(title, fields, onSave) {
            document.getElementById('modal-title').innerText = title;
            const body = document.getElementById('modal-body');
            body.innerHTML = '';
            fields.forEach(f => {
                const wrapper = document.createElement('div');
                const label = document.createElement('label');
                label.className = "block text-xs font-bold text-brand-dark mb-1";
                label.innerText = f.label;
                let input;
                if(f.type === 'textarea') {
                    input = document.createElement('textarea'); input.rows = 4;
                } else if(f.type === 'select') {
                    input = document.createElement('select');
                    f.options.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt; o.innerText = opt;
                        if(opt === f.value) o.selected = true;
                        input.appendChild(o);
                    });
                } else if(f.type === 'file') {
                    input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
                    if(f.multiple) input.multiple = true;
                    input.onchange = function(e) {
                        const files = e.target.files;
                        if (files.length > 0) {
                            if(f.multiple) {
                                let base64Arr = []; let loaded = 0;
                                Array.from(files).forEach((file) => {
                                    const reader = new FileReader();
                                    reader.onload = function(re) {
                                        base64Arr.push(re.target.result); loaded++;
                                        if(loaded === files.length) input.setAttribute('data-base64', JSON.stringify(base64Arr));
                                    };
                                    reader.readAsDataURL(file);
                                });
                            } else {
                                const reader = new FileReader();
                                reader.onload = function(re) { input.setAttribute('data-base64', re.target.result); };
                                reader.readAsDataURL(files[0]);
                            }
                        }
                    };
                } else {
                    input = document.createElement('input'); input.type = f.type || 'text';
                }
                input.className = "w-full p-2 border border-brand-border rounded-lg bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-brand-primary/50 text-sm";
                input.id = 'modal-input-' + f.id;
                if(f.type !== 'select' && f.type !== 'file') input.value = f.value || '';
                wrapper.appendChild(label); wrapper.appendChild(input); body.appendChild(wrapper);
            });
            modalSaveCallback = () => {
                const result = {};
                fields.forEach(f => {
                    const el = document.getElementById('modal-input-' + f.id);
                    result[f.id] = (f.type === 'file') ? (el.getAttribute('data-base64') || f.value || '') : el.value;
                });
                onSave(result);
            };
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        window.closeModal = function() { document.getElementById('custom-modal').classList.add('hidden'); }
        document.getElementById('modal-save-btn').onclick = () => { if(modalSaveCallback) modalSaveCallback(); closeModal(); };

        let confirmCallback = null;
        window.openConfirm = function(msg, onConfirm) {
            document.getElementById('confirm-msg').innerText = msg;
            confirmCallback = onConfirm;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }
        window.closeConfirm = function() { document.getElementById('confirm-modal').classList.add('hidden'); }
        document.getElementById('confirm-btn').onclick = () => { if(confirmCallback) confirmCallback(); closeConfirm(); };

            openModal("Profili Düzenle", [{ id: 'name', label: 'İsmin', value: state.profile.name }], (data) => {
                state.profile.name = data.name; saveState();
            });
        }

        function setDailyVerse() {
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            document.getElementById('header-verse').innerText = defaultVerses[dayOfYear % defaultVerses.length];
        }

        function renderMonthlySongs() {
            const container = document.getElementById('monthly-songs-container');
            container.innerHTML = state.monthlySongs.map(ms => `
                <div class="bg-white p-3 rounded-xl border border-brand-border shadow-sm flex justify-between items-center group">
                    <div>
                        <span class="text-[10px] font-bold text-brand-primary uppercase">${ms.month}</span>

                    </div>
                    <div class="flex gap-1.5 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="editMonthlySong('${ms.id}')" class="text-brand-muted hover:text-brand-primary"><i class="fas fa-pen"></i></button>

                    </div>
                </div>
            `).join('');

        window.addMonthlySong = function() {
            openModal("Aylık Şarkı Ekle", [{ id: 'month', label: 'Ay', value: '' }, { id: 'song', label: 'Şarkı', value: '' }], (data) => {
                if(data.month && data.song) { state.monthlySongs.push({ id: Math.random().toString(36).substr(2, 9), ...data }); saveState(); }
            });
        }
        window.editMonthlySong = function(id) {
            const ms = state.monthlySongs.find(x => x.id === id);
            openModal("Düzenle", [{ id: 'month', label: 'Ay', value: ms.month }, { id: 'song', label: 'Şarkı', value: ms.song }], (data) => {
                if(data.month && data.song) { Object.assign(ms, data); saveState(); }
            });
        }
        window.deleteMonthlySong = function(id) {
            openConfirm("Silinsin mi?", () => { state.monthlySongs = state.monthlySongs.filter(x => x.id !== id); saveState(); });
        }

        function setDate() {
            document.getElementById('header-date').innerText = new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            setDailyVerse();
            renderMonthlySongs();
        }

        window.processSmartAdd = function() {
            const input = document.getElementById('smart-input');
            const text = input.value.trim();
            if(!text) return;
            const lower = text.toLowerCase();
            if(lower.includes("vize") || lower.includes("final") || lower.includes("sınav")) {
                state.exams.push({ id: Math.random().toString(36).substr(2, 9), name: text, date: "Tarih Belirtilmedi", type: "Vize" });
            } else {
                state.goals.push({ id: Math.random().toString(36).substr(2, 9), title: text, type: "Günlük", completed: false });
            }
            input.value = ""; saveState();
        }

        function renderGoals() {
            const container = document.getElementById('goals-container');
            const filter = document.getElementById('goal-filter').value;
            const filtered = state.goals.filter(g => filter === "Tümü" || g.type === filter);
            if(filtered.length === 0) { container.innerHTML = `<p class="text-xs text-brand-muted italic py-4 text-center">Kayıt yok.</p>`; return; }
            container.innerHTML = filtered.map(g => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-brand-border text-sm group">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" ${g.completed ? 'checked' : ''} onchange="toggleGoal('${g.id}')" class="w-4 h-4 text-brand-primary rounded">
                        <span class="${g.completed ? 'line-through text-brand-muted' : 'text-brand-dark font-medium'}">${g.title}</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] px-2 py-1 rounded bg-white border border-brand-border font-bold text-brand-muted">${g.type}</span>
                        <button onclick="deleteGoal('${g.id}')" class="text-brand-muted hover:text-red-500 opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }
        window.addGoal = function() {
            openModal("Yeni Hedef", [{ id: 'title', label: 'Başlık', value: '' }, { id: 'type', label: 'Zaman', type: 'select', options: ['Günlük', 'Haftalık', 'Aylık', 'Yıllık'], value: 'Günlük' }], (d) => {
                if(d.title) { state.goals.push({ id: Math.random().toString(36).substr(2, 9), title: d.title, type: d.type, completed: false }); saveState(); }
            });
        }
        window.toggleGoal = function(id) { state.goals.find(g => g.id === id).completed = !state.goals.find(g => g.id === id).completed; saveState(); }
        window.deleteGoal = function(id) { state.goals = state.goals.filter(g => g.id !== id); saveState(); }

            { id: 3, name: "Sandalyede Arka Kol", svg: `<i class="fas fa-chair"></i>`, startReps: 5, inc: 3 },

        ];

        function renderSports() {
            const container = document.getElementById('workout-container');
            const week = state.workoutWeek;
            document.getElementById('workout-week-badge').innerText = `${week}. Hafta`;
            let html = '';
            for(let i=0; i < Math.min(week, sportMoves.length); i++) {
                const move = sportMoves[i];
                const isNew = (i === week - 1);
                const currentReps = move.startReps + (week - 1 - i) * move.inc;
                html += `
                <div class="bg-gray-50 border border-brand-border rounded-xl p-4 flex flex-col md:flex-row items-center gap-4">
                    ${isNew ? `<div class="w-full md:w-1/3 sport-img">${move.svg}</div>` : ''}
                    <div class="flex-1 text-center md:text-left">
                        <div class="font-bold text-lg text-brand-dark">${move.name}</div>
                        <div class="text-3xl font-extrabold text-brand-primary mt-2">${currentReps} <span class="text-sm text-brand-muted">${move.unit || "Tekrar"}</span></div>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }
        window.nextWorkoutWeek = function() {
            state.workoutWeek = (state.workoutWeek < sportMoves.length) ? state.workoutWeek + 1 : 1;
            saveState();
        }

        }
        window.deletePeriod = function(id) { state.health.periods = state.health.periods.filter(x => x.id !== id); saveState(); }
        window.addCare = function() { openModal("Randevu", [{ id: 'title', label: 'Adı' }, { id: 'date', label: 'Tarih' }], (d) => { if(d.title) { state.health.care.push({ id: Math.random().toString(36).substr(2, 9), ...d }); saveState(); } }); }
        window.deleteCare = function(id) { state.health.care = state.health.care.filter(x => x.id !== id); saveState(); }

        function renderLadder() {
            document.getElementById('ladder-container').innerHTML = state.ladder.map((step, index) => {
                const isLocked = !step.unlocked;
                const currentStreak = step.streak;
                return `
                <div class="border ${isLocked ? 'border-gray-200 bg-gray-50 opacity-60' : 'border-brand-secondary/30 bg-white shadow-sm'} rounded-xl p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm text-brand-dark">${step.title}</h3>
                        <span class="px-2 py-1 bg-brand-primary/10 text-brand-primary rounded text-[10px] font-bold">${currentStreak}/21</span>
                    </div>
                    ${!isLocked ? `
                    <div class="flex gap-2">
                        <button onclick="progressLadder('${step.id}')" class="flex-1 bg-brand-dark text-white py-2 rounded-lg text-xs font-bold">✅ Bugün Tamam</button>
                        <button onclick="resetLadder('${step.id}')" class="px-3 py-2 bg-red-50 text-red-500 rounded-lg text-xs font-bold">Sıfırla</button>
                    </div>` : '<div class="text-xs text-brand-muted italic">Kilitli</div>'}
                </div>`;
            }).join('');
        }
        window.addLadderStep = function() {
            openModal("Yeni Basamak", [{ id: 'title', label: 'İbadet', value: '' }], (d) => { if(d.title) { state.ladder.push({ id: Math.random().toString(36).substr(2, 9), title: d.title, streak: 0, unlocked: false }); saveState(); } });
        }
        window.progressLadder = function(id) {
            const index = state.ladder.findIndex(s => s.id === id);
            state.ladder[index].streak++;
            if(state.ladder[index].streak === 21 && state.ladder[index + 1]) state.ladder[index + 1].unlocked = true;
            saveState();
        }
        window.resetLadder = function(id) { state.ladder.find(s => s.id === id).streak = 0; saveState(); }

        function renderRamazan() {
            document.getElementById('ramazan-grid').innerHTML = Array.from({length: 30}, (_, i) => i + 1).map(d => {
                const isDone = (state.ramazan.days[d] || {}).fasting;
                return `<button onclick="openRamazanDay(${d})" class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold ${isDone ? 'bg-brand-secondary text-white' : 'bg-white/10 text-white'}"><span>${d}</span></button>`;
            }).join('');
        }
        window.openRamazanDay = function(d) {
            const detail = document.getElementById('ramazan-day-detail');
            detail.classList.remove('hidden');
            const data = state.ramazan.days[d] || { fasting: false, water: 0, cuz: '1. Cüz' };
            detail.innerHTML = `
                <div class="flex justify-between mb-2"><h3 class="font-bold text-yellow-400">Ramazan ${d}. Gün</h3><button onclick="document.getElementById('ramazan-day-detail').classList.add('hidden')"><i class="fas fa-times"></i></button></div>
                <label class="flex items-center gap-2 text-xs"><input type="checkbox" ${data.fasting ? 'checked' : ''} onchange="state.ramazan.days[${d}] = {...(state.ramazan.days[${d}]||{}), fasting: this.checked}; saveState(); renderRamazan();"> Oruçlu</label>
            `;
        }

        function renderMedia() {
            document.getElementById('media-container').innerHTML = state.media.map(m => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border text-sm">
                    <div><div class="font-bold text-brand-dark">${m.title}</div><div class="text-[10px] text-purple-500">${m.type} • ${m.status}</div></div>
                    <button onclick="deleteMedia('${m.id}')" class="text-brand-muted hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }
        window.addMedia = function() {
            openModal("Medya Ekle", [{ id: 'title', label: 'Adı', value: '' }], (d) => { if(d.title) { state.media.push({ id: Math.random().toString(36).substr(2, 9), ...d, type: 'Film', status: 'İzlenecek' }); saveState(); } });
        }
        window.deleteMedia = function(id) { state.media = state.media.filter(x => x.id !== id); saveState(); }

        function renderBookReviews() {
            document.getElementById('book-reviews-container').innerHTML = state.bookReviews.map(b => `
                <div class="flex bg-gray-50 border rounded-xl p-3 gap-4">
                    <div class="flex-1"><h3 class="font-bold text-sm">${b.title}</h3><p class="text-xs text-brand-muted">${b.author}</p><p class="text-xs italic mt-1">"${b.review}"</p></div>
                    <button onclick="deleteBookReview('${b.id}')" class="text-brand-muted hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }
        window.addBookReview = function() {
            openModal("Kitap Ekle", [{ id: 'title', label: 'Kitap' }, { id: 'author', label: 'Yazar' }, { id: 'review', label: 'İnceleme', type: 'textarea' }], (d) => {
                if(d.title) { state.bookReviews.push({ id: Math.random().toString(36).substr(2, 9), ...d, rating: '5', cover: '' }); saveState(); }
            });
        }
        window.deleteBookReview = function(id) { state.bookReviews = state.bookReviews.filter(x => x.id !== id); saveState(); }

        function renderBudget() {
            document.getElementById('budget-container').innerHTML = state.budget.map(b => `
                <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl border text-xs">
                    <span>${b.desc} [${b.asset}]</span><span class="font-bold text-green-600">+${b.amount}</span>
                    <button onclick="deleteBudget('${b.id}')" class="text-brand-muted hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            document.getElementById('savings-summary').innerHTML = `<div>• Toplam Kayıtlı Varlıklar Mevcut</div>`;
        }
        window.addBudget = function() {
            openModal("Birikim Ekle", [{ id: 'desc', label: 'Açıklama' }, { id: 'amount', label: 'Miktar', type: 'number' }], (d) => {
                if(d.desc && d.amount) { state.budget.push({ id: Math.random().toString(36).substr(2, 9), desc: d.desc, amount: parseFloat(d.amount), asset: 'TL' }); saveState(); }
            });
        }
        window.deleteBudget = function(id) { state.budget = state.budget.filter(x => x.id !== id); saveState(); }

        function renderJournal() {
            document.getElementById('journal-container').innerHTML = state.journal.map(j => `
                <div class="polaroid relative flex flex-col">
                    <p class="text-sm font-handwriting text-brand-dark flex-1">${j.text}</p>
                    <div class="text-[10px] text-brand-muted text-right mt-2">${j.date}</div>
                    <button onclick="deleteJournal('${j.id}')" class="absolute top-2 right-2 text-red-500 text-xs"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        }
        window.addJournal = function() {
            openModal("Anı", [{ id: 'text', label: 'Not', type: 'textarea' }], (d) => {
                if(d.text) { state.journal.unshift({ id: Math.random().toString(36).substr(2, 9), text: d.text, date: new Date().toLocaleDateString('tr-TR'), imgs: [] }); saveState(); }
            });
        }
        window.deleteJournal = function(id) { state.journal = state.journal.filter(x => x.id !== id); saveState(); }

        window.exportJournalPDF = function() { window.print(); }

        function renderAll() {
            document.getElementById('header-name').innerText = state.profile.name;
            setDate();
            renderGoals(); renderDailyHabits(); renderBrainDump(); renderScheduleGrid();
            renderExams(); renderFurkan(); renderIhya(); renderHealth(); renderSports();
            renderLadder(); renderRamazan(); renderMedia(); renderBookReviews(); renderBudget(); renderJournal();
        }

        // Giriş ekranını tamamen gizle ve doğrudan başlat
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('auth-user-info').innerHTML = `<i class="fas fa-hdd text-green-400 mr-1"></i> Yerel Hafıza Modu`;
        document.getElementById('sync-indicator').innerHTML = `<i class="fas fa-check-circle"></i> Cihaza Kayıtlı`;

        window.onload = () => { renderAll(); };
    </script>
